<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SquatClient graphics demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #ccc; font: 13px system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { width: 100%; height: 100%; display: block; }
      #msg { position: fixed; left: 12px; top: 12px; max-width: 70ch; white-space: pre-wrap; z-index: 5; }
      #input { position: fixed; left: 12px; bottom: 6px; right: 200px; height: 30px; line-height: 30px; padding: 0 10px; background: #0b0b0b; border: 1px solid #333; border-radius: 4px; color: #9c9; font: 14px ui-monospace, monospace; z-index: 6; opacity: 0; }
      #hud { position: fixed; right: 10px; bottom: 8px; font: 11px ui-monospace, monospace; color: #6c6; z-index: 5; text-shadow: 0 0 4px #000; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="msg"></div>
    <div id="hud"></div>
    <div id="input" title="what the Lua script dropped into the input line"></div>
    <script type="module" src="/src/gfx/demo/main.ts"></script>
  </body>
</html>
