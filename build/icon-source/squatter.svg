<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27314c"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.36" cy="0.74" r="0.42">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>

  <!-- the tile -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>
  <rect x="104" y="104" width="816" height="816" rx="186" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- a terminal prompt, up in the corner -->
  <path d="M215 262 L292 318 L215 374" fill="none" stroke="#3ddbd0" stroke-opacity="0.75" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the ground is a blinking cursor -->
  <rect x="236" y="800" width="560" height="46" rx="12" fill="#3ddbd0"/>

  <!-- campfire -->
  <g>
    <rect x="296" y="770" width="130" height="28" rx="14" fill="#6b4a2e" transform="rotate(-14 361 784)"/>
    <rect x="296" y="770" width="130" height="28" rx="14" fill="#82593a" transform="rotate(14 361 784)"/>
    <path d="M361 780 C318 750 330 705 361 662 C368 700 402 716 392 752 C390 766 378 776 361 780Z" fill="#ff8a2b"/>
    <path d="M361 780 C340 764 346 738 362 716 C368 738 384 748 378 764 C375 772 369 777 361 780Z" fill="#ffd35c"/>
    <circle cx="322" cy="676" r="6" fill="#ffd35c"/>
    <circle cx="408" cy="650" r="5" fill="#ffb347"/>
    <circle cx="384" cy="620" r="4" fill="#ffd35c"/>
  </g>

  <g filter="url(#sh)">
    <!-- bindle: a stick over the shoulder with a bandana bundle -->
    <path d="M668 520 L806 330" stroke="#6b4a2e" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="820" cy="306" r="54" fill="#d2483f"/>
    <path d="M786 340 L842 352 L826 330Z" fill="#b53a33"/>
    <circle cx="800" cy="288" r="8" fill="#fff" fill-opacity="0.9"/>
    <circle cx="838" cy="300" r="8" fill="#fff" fill-opacity="0.9"/>
    <circle cx="820" cy="328" r="8" fill="#fff" fill-opacity="0.9"/>
    <circle cx="848" cy="270" r="6" fill="#fff" fill-opacity="0.9"/>

    <!-- legs: knees up, boots in front -->
    <path d="M648 706 L560 618 L586 764" stroke="#4c5873" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="520" y="738" width="100" height="52" rx="22" fill="#2b2118"/>
    <!-- a patch on the knee -->
    <rect x="534" y="598" width="40" height="40" rx="8" fill="#e0b84c" transform="rotate(-18 554 618)"/>

    <!-- torso in a patched coat -->
    <path d="M660 696 L644 540" stroke="#7a5c3a" stroke-width="132" stroke-linecap="round" fill="none"/>
    <rect x="632" y="600" width="44" height="44" rx="8" fill="#5e8f6a" transform="rotate(10 654 622)"/>
    <rect x="600" y="668" width="34" height="34" rx="8" fill="#c5694b" transform="rotate(-12 617 685)"/>

    <!-- arm reaching for the fire -->
    <path d="M626 572 L500 650" stroke="#6a4f31" stroke-width="44" stroke-linecap="round" fill="none"/>
    <circle cx="478" cy="662" r="27" fill="#f0c49c"/>

    <!-- head -->
    <circle cx="612" cy="452" r="62" fill="#f0c49c"/>
    <circle cx="552" cy="470" r="17" fill="#e5b088"/>             <!-- nose -->
    <circle cx="583" cy="448" r="8" fill="#2a2018"/>               <!-- eye -->
    <path d="M572 492 Q596 508 624 496" stroke="#2a2018" stroke-width="7" stroke-linecap="round" fill="none"/>
    <g fill="#5a4636"><circle cx="590" cy="506" r="3"/><circle cx="606" cy="512" r="3"/><circle cx="624" cy="512" r="3"/><circle cx="640" cy="506" r="3"/><circle cx="650" cy="492" r="3"/><circle cx="578" cy="498" r="3"/></g>
    <!-- floppy hat with a band and a hole-y patch -->
    <ellipse cx="612" cy="404" rx="110" ry="22" fill="#2f251d"/>
    <path d="M540 404 C540 336 684 336 684 404Z" fill="#3d3128"/>
    <rect x="540" y="388" width="144" height="16" fill="#a8412f"/>
    <rect x="636" y="354" width="26" height="26" rx="5" fill="#e0b84c" transform="rotate(12 649 367)"/>
    <path d="M520 410 C540 424 560 420 574 410" stroke="#2f251d" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
